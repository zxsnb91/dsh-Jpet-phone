# 在 GitHub 的云端机器上把「深深桌宠」重新打包成可上下乱跑的 APK。
# 放在 fork 的 .github/workflows/build-apk.yml，push 或手动都会跑。
name: build-apk-2d-roam

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 托管 runner 自带 Android SDK；不再用 setup-android（它跑 sdkmanager tools 会挂）。
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME}" | head -20
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "sdkmanager=${SDKMANAGER}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          fi
          echo "installed platforms:"; ls "${ANDROID_HOME}/platforms" 2>/dev/null || true
          echo "installed build-tools:"; ls "${ANDROID_HOME}/build-tools" 2>/dev/null || true

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
          python -m pip install --upgrade pip
          python -m pip install pillow imageio-ffmpeg "PySide6-Essentials==6.8.3"

      - name: 拉取动画源视频（约 52 MB）
        run: python android-app/scripts/fetch_character_videos.py

      - name: 打包 debug APK
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: '1'
        run: |
          cd android-app
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleDebug -PpetPython=python --console=plain

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-2d-roam-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
